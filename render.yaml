# Render Infrastructure-as-Code (Blueprint) Configuration
# Deploys NestJS Backend API + Managed PostgreSQL Database on Render

services:
  - type: web
    name: fashion-store-api
    env: node
    region: singapore
    plan: free
    buildCommand: pnpm install --production=false --no-frozen-lockfile && pnpm --filter @fashion-store/shared-types build && pnpm --filter @fashion-store/api db:generate && pnpm --filter @fashion-store/api build
    startCommand: npx prisma db push --schema=apps/api/src/prisma/schema.prisma && pnpm --filter @fashion-store/api db:seed && pnpm --filter @fashion-store/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fashion-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STOREFRONT_URL
        value: http://localhost:3001
      - key: ADMIN_URL
        value: http://localhost:3002

databases:
  - name: fashion-store-db
    plan: free
    region: singapore
    databaseName: fashionstoredb
    user: fashionuser
